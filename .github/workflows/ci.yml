name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NovaWallet.sln
      - run: dotnet format NovaWallet.sln --verify-no-changes --no-restore
      - run: dotnet build NovaWallet.sln -c Release --no-restore
      # Integration tests start PostgreSQL 16 with Testcontainers on the runner's Docker.
      - run: dotnet test NovaWallet.sln -c Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory TestResults
      # Surface each failed test as an annotation on the pull request.
      - if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  if result.get("outcome") == "Failed":
                      message = " ".join((result.findtext(".//t:Message", default="", namespaces=ns) or "").split())[:900]
                      print(f"::error title={result.get('testName')}::{message}")

  compose:
    name: docker compose up + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
